main: com.lymeowz.lib.LyMeowzLib
name: LyMeowzLib
provides: [AgarthaLib]
version: 2.17.2
api-version: 1.13
website: https://www.spigotmc.org/resources/authors/70791
author: Praya Amadiga Pitasa
softdepend:
- PlaceholderAPI
- MVdWPlaceholderAPI
- MythicLib
- AuraSkills
- MMOCore
- Lands
- DecentHolograms

commands:
  lymeowzlib:
    description: LyMeowzLib base command
    aliases:
    - agartha
    
permissions:
  agarthalib.admin:
    description: Gives access to everything!
    children:
      agarthalib.command.reload: true

  # New canonical permission namespace. Legacy permissions above remain live.
  lymeowzlib.admin:
    description: Administrative access to LyMeowzLib
    default: op
    children:
      lymeowzlib.command.reload: true

  lymeowzlib.command.reload:
    description: Reload LyMeowzLib configuration
    default: false