name: Paper 26.3 AgarthaLib CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-26.3-agarthalib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Guard original YAML and gameplay logic
        run: python3 .github/scripts/check_legacy_logic.py
      - name: Guard Paper 26.3 living target and legacy particle routes
        run: python3 .github/scripts/check_paper26_bridge_routes.py
      - name: Guard optional MythicLib and removed Factions runtime hooks
        run: python3 .github/scripts/check_paper26_provider_routes.py
      - name: Enforce Paper 26.3-only packet build and bridge routing
        run: python3 .github/scripts/check_paper26_nms_cutover.py
      - name: Inventory typed callers of obsolete plugin APIs
        run: python3 .github/scripts/audit_paper26_legacy_bindings.py
      - name: Audit exact remaining NMS and provider source debt
        run: python3 .github/scripts/audit_paper26_remaining.py
      - name: Java and Gradle versions
        run: |
          java -version
          gradle --version
      - name: Verify PAPI expansion, original YAML callback, Vault API and Paper bridges
        shell: bash
        run: |
          set -o pipefail
          gradle testPaper26PapiOptional --no-daemon --console=plain 2>&1 | tee paper26-item-api-check.log
      - name: Build with compiler diagnostics
        if: always()
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --continue --no-daemon --console=plain --stacktrace 2>&1 | tee build-26.3.log
      - name: Summarize grouped compiler errors
        if: always()
        shell: bash
        run: |
          python3 .github/scripts/compile_report.py build-26.3.log > compiler-report.md
          cat compiler-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Scan all Java source files for migration risks
        if: always()
        run: |
          python3 .github/scripts/audit_source_api.py > source-audit.md
          cat source-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload migration source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper26-source-audit
          path: |
            build/reports/paper26-remaining.json
            build/reports/paper26-legacy-api-callers.json
          if-no-files-found: warn
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agarthalib-build-26.3-log
          path: |
            build-26.3.log
            compiler-report.md
            source-audit.md
            paper26-item-api-check.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload test jars (not a verified release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agarthalib-paper-26.3-test
          path: build/libs/*.jar
          if-no-files-found: error
