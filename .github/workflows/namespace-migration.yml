name: One-time full Java namespace migration — LyMeowzLib
on:
  push:
    branches: [master]
    paths:
      - ci/migrate_all_java_packages.py
      - .github/workflows/namespace-migration.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-lib-namespace-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Migrate Java packages, references and historical guard baseline
        run: python3 ci/migrate_all_java_packages.py --apply
      - name: Validate Paper 26.3 native build after relocation
        run: gradle clean build publishToMavenLocal testPaper26PapiOptional --no-daemon --console=plain
      - name: Validate source and jar package guard
        run: |
          python3 .github/scripts/check_paper26_jar_contents.py
          python3 .github/scripts/check_legacy_logic.py
      - name: Commit verified migration on master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(lib): migrate every Java package to com.lymeowz.lib"
          git push origin HEAD:master
